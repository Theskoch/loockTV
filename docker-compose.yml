version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lookit
      POSTGRES_USER: lookit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lookit_secret}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookit"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lookit
      DB_USER: lookit
      DB_PASSWORD: ${DB_PASSWORD:-lookit_secret}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      UPLOADS_DIR: /data/uploads
      PORT: 3000
    volumes:
      - ./data/uploads:/data/uploads
      - ./admin-ui/dist:/app/admin-ui/dist:ro
    ports:
      - "${SERVER_PORT:-3000}:3000"

volumes: {}
