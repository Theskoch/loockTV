name: Build Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: client
        run: npm install

      # On tag push: sync package.json version with git tag so latest.yml is correct
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: client
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Version set to $version"

      # On tag: build + publish to GitHub Releases (generates latest.yml for auto-updater)
      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: client
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On manual trigger: just build, no publish
      - name: Build only (manual)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: client
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoockIT-Windows-Installer
          path: client/release/LoockIT-Setup.exe
          retention-days: 30
