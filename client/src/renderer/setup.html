<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>LoockIT — Настройка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: #111827;
    border-radius: 16px;
    padding: 40px;
    width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  p { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
  label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
  input {
    width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 10px;
    padding: 12px 16px; color: #fff; font-size: 14px; outline: none; margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%; background: #4f46e5; color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #4338ca; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: rgba(239,68,68,0.15); color: #fca5a5; border-radius: 8px;
    padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>LoockIT</h1>
  <p>Первоначальная настройка. Введи адрес сервера и API ключ экрана.</p>
  <div id="error" class="error"></div>
  <form id="form">
    <label>Адрес сервера</label>
    <input id="serverUrl" type="text" placeholder="http://192.168.1.100:3000" required />
    <label>API ключ экрана (мин. 32 символа)</label>
    <input id="apiKey" type="text" placeholder="Введи ключ из панели администратора" required />
    <button type="submit" id="btn">Подключиться</button>
  </form>
</div>
<script>
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const errEl = document.getElementById('error');
    btn.disabled = true;
    btn.textContent = 'Подключение...';
    errEl.style.display = 'none';

    const serverUrl = document.getElementById('serverUrl').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();

    const result = await window.lookit.setup.save({ serverUrl, apiKey });
    if (result?.error) {
      errEl.textContent = result.error;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Подключиться';
    }
  });
</script>
</body>
</html>
