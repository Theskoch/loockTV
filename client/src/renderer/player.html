<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>LoockIT Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }

  #container { width: 100%; height: 100%; position: relative; }

  .slide { position: absolute; inset: 0; display: none; }
  .slide.active { display: flex; align-items: center; justify-content: center; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slide video { width: 100%; height: 100%; object-fit: contain; }
  webview { width: 100%; height: 100%; border: none; }

  #no-content {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; color: #374151; font-family: sans-serif;
  }
  #no-content h1 { font-size: 28px; margin-bottom: 8px; }
  #no-content p { font-size: 14px; }

  /* Invisible hover zone — bottom-left corner */
  #corner-zone {
    position: fixed; bottom: 0; left: 0;
    width: 80px; height: 80px;
    z-index: 9999;
  }

  #corner-panel {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(10, 10, 20, 0.88);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
    pointer-events: none;
    min-width: 220px;
  }
  #corner-panel.visible {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  #corner-panel .label {
    font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.35);
    margin-bottom: 4px;
  }
  #corner-panel .value {
    font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.65);
    margin-bottom: 10px; word-break: break-all;
  }
  #corner-panel button {
    width: 100%; padding: 7px 12px;
    background: rgba(239,68,68,0.2); color: rgba(239,100,100,0.9);
    border: 1px solid rgba(239,68,68,0.3); border-radius: 8px;
    font-size: 12px; cursor: pointer; transition: background 0.2s;
  }
  #corner-panel button:hover { background: rgba(239,68,68,0.4); }
</style>
</head>
<body>
<div id="container">
  <div id="no-content">
    <h1>LoockIT</h1>
    <p>Плейлист не назначен. Назначь его в панели администратора.</p>
  </div>
</div>

<!-- Invisible hover trigger in bottom-left corner -->
<div id="corner-zone"></div>

<!-- Panel that appears on hover -->
<div id="corner-panel">
  <div class="label">Экран</div>
  <div class="value" id="info-name">—</div>
  <div class="label">Сервер</div>
  <div class="value" id="info-server">—</div>
  <div class="label">Статус</div>
  <div class="value" id="info-status">—</div>
  <button onclick="resetDevice()">Перепривязать</button>
</div>

<script>
  let playlist = null;
  let override = null;
  let currentIdx = 0;
  let timer = null;
  let activeSlide = null;

  // Corner hover logic
  const zone = document.getElementById('corner-zone');
  const panel = document.getElementById('corner-panel');
  let hideTimer = null;

  zone.addEventListener('mouseenter', () => {
    clearTimeout(hideTimer);
    panel.classList.add('visible');
  });
  zone.addEventListener('mouseleave', () => {
    hideTimer = setTimeout(() => { if (!panel.matches(':hover')) panel.classList.remove('visible'); }, 250);
  });
  panel.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  panel.addEventListener('mouseleave', () => {
    hideTimer = setTimeout(() => panel.classList.remove('visible'), 250);
  });

  async function resetDevice() {
    if (confirm('Сбросить привязку к серверу?')) {
      await window.lookit.setup.reset();
    }
  }

  function setInfo(name, server, status) {
    document.getElementById('info-name').textContent = name || '—';
    document.getElementById('info-server').textContent = server || '—';
    document.getElementById('info-status').textContent = status || '—';
  }

  function clearContainer() {
    const c = document.getElementById('container');
    const noContent = document.getElementById('no-content');
    c.innerHTML = '';
    c.appendChild(noContent);
    activeSlide = null;
  }

  function showNoContent() {
    document.getElementById('no-content').style.display = 'flex';
  }

  function hideNoContent() {
    document.getElementById('no-content').style.display = 'none';
  }

  function buildSlide(item) {
    const div = document.createElement('div');
    div.className = 'slide';

    if (item.type === 'image') {
      const img = document.createElement('img');
      // Use local cached path if available, otherwise fetch from server
      img.src = item.localPath ? `file://${item.localPath}` : (item.file_path ? `/api/content/file/${item.file_path}` : '');
      div.appendChild(img);
    } else if (item.type === 'video') {
      const video = document.createElement('video');
      video.src = item.localPath ? `file://${item.localPath}` : (item.file_path ? `/api/content/file/${item.file_path}` : '');
      video.muted = true; // start muted to guarantee autoplay, then unmute
      video.autoplay = true;
      video.loop = false;
      video.playsInline = true;
      // Unmute after playback starts (autoplay requires muted initially)
      video.addEventListener('playing', () => { video.muted = false; }, { once: true });
      div.appendChild(video);
    } else if (item.type === 'url') {
      const wv = document.createElement('webview');
      wv.src = item.url;
      wv.setAttribute('allowpopups', 'false');
      div.appendChild(wv);
    }

    return div;
  }

  function showItem(item, duration, onDone) {
    clearTimeout(timer);
    const c = document.getElementById('container');

    if (activeSlide) {
      const vid = activeSlide.querySelector('video');
      if (vid) vid.pause();
      activeSlide.classList.remove('active');
      activeSlide.remove();
    }

    hideNoContent();
    const slide = buildSlide(item);
    c.appendChild(slide);
    slide.classList.add('active');
    activeSlide = slide;

    if (item.type === 'video') {
      const vid = slide.querySelector('video');
      vid.onerror = () => {
        // Codec not supported or file corrupt — skip after 2s
        console.warn('Video error, skipping:', item.name);
        clearTimeout(timer);
        timer = setTimeout(onDone, 2000);
      };
      vid.play().catch(err => {
        console.warn('Video play() failed:', err.message);
        // Try muted as fallback
        vid.muted = true;
        vid.play().catch(() => { timer = setTimeout(onDone, 2000); });
      });
      vid.onended = onDone;
      if (duration) timer = setTimeout(onDone, duration * 1000);
    } else {
      timer = setTimeout(onDone, duration * 1000);
    }

    setInfo(
      playlist?.items?.[currentIdx - 1]?.name || item.name,
      null,
      `${item.type} · ${item.duration_seconds || duration}с`
    );
  }

  function isOverrideActive() {
    if (!override) return false;
    const now = new Date();
    return new Date(override.start_at) <= now && now <= new Date(override.end_at);
  }

  function playNext() {
    clearTimeout(timer);

    if (isOverrideActive()) {
      const msLeft = new Date(override.end_at) - new Date();
      showItem(
        { type: override.type, name: override.name, localPath: override.localPath, file_path: override.file_path, url: override.url },
        Math.max(Math.ceil(msLeft / 1000), 1),
        playNext
      );
      return;
    }

    if (!playlist || !playlist.items || playlist.items.length === 0) {
      showNoContent();
      setInfo('—', null, 'Нет плейлиста');
      return;
    }

    if (currentIdx >= playlist.items.length) currentIdx = 0;
    const item = playlist.items[currentIdx];
    currentIdx = (currentIdx + 1) % playlist.items.length;

    showItem(item, item.duration_seconds || 10, playNext);
  }

  async function init() {
    const data = await window.lookit.player.getPlaylist();
    if (data) {
      playlist = data.playlist;
      override = data.override;
    }
    playNext();

    window.lookit.player.onSync((data) => {
      const wasPlaylistId = playlist?.playlist_id;
      playlist = data.playlist;
      override = data.override;
      if (isOverrideActive()) { clearTimeout(timer); playNext(); }
      else if (playlist?.playlist_id !== wasPlaylistId) { currentIdx = 0; playNext(); }
    });

    window.lookit.player.onRestart(() => {
      currentIdx = 0;
      playNext();
    });
  }

  init();
</script>
</body>
</html>
